schema_version: 1

context:
  name: mold
  version: "3.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/rui314/mold/archive/c522789231c9de8afb35722bf8c859341f1fcef6.tar.gz
  sha256: 802fa9543208923a0fdcb60d1b407e1160464213b9334adc632df7d54971ce26

build:
  number: 0
  skip: win
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - if: x86_64
        then:
        - export CARGO_PROFILE_RELEASE_LTO=fat
      - if: aarch64
        then:
        - export CARGO_PROFILE_RELEASE_LTO=thin
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - cargo build -j${CPU_COUNT} --release
      - env
      - ls -lR "${SRC_DIR}/target"
      - CARGO_TARGET_DIR="${SRC_DIR}/target/${CARGO_BUILD_TARGET}" ${SRC_DIR}/install-mold.sh

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - mimalloc
  ignore_run_exports:
    by_name:
      - mimalloc

tests:
  - script:
      - mold --version

about:
  license: MIT
  license_file:
    - THIRDPARTY.yml
    - LICENSE
  summary: A Modern Linker
  homepage: https://github.com/rui314/mold

extra:
  recipe-maintainers:
    - apmorton
